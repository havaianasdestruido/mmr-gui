name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (x64 SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore mmr-gui.csproj

      - name: Build
        run: dotnet build mmr-gui.csproj -c ${{ matrix.configuration }} --no-restore -warnaserror

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: mmr-gui-${{ matrix.configuration }}
          path: bin/${{ matrix.configuration }}/net10.0-windows/

  selfcheck:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (x86 SDK)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          architecture: x86

      - name: Restore
        run: dotnet restore mmr-gui.csproj

      - name: Build
        run: dotnet build mmr-gui.csproj -c Debug --no-restore

      - name: Managed self-check
        run: bin\Debug\net10.0-windows\mmr-gui.exe --selfcheck
